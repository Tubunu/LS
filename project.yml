name: LongScreenshot
options:
  bundleIdPrefix: com.tubunu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  LongScreenshot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LongScreenshot
    settings:
      base:
        PRODUCT_NAME: "LongScreenshot"
        PRODUCT_BUNDLE_IDENTIFIER: com.tubunu.LongScreenshot
        INFOPLIST_FILE: LongScreenshot/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  LongScreenshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LongScreenshotTests
    dependencies:
      - target: LongScreenshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tubunu.LongScreenshotTests
        SWIFT_VERSION: "5.9"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LongScreenshot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LongScreenshot"
