name: Build iOS Release IPA

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App Version (e.g. 2.0.0)'
        required: false
        default: '2.0.0'
      build_number:
        description: 'Build Number (e.g. 1)'
        required: false
        default: '1'
      create_release:
        description: 'Create GitHub Release with IPA'
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen || true

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Set App Version & Build Number
        run: |
          VERSION="${{ github.event.inputs.version_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '2.3.2' }}"
          VERSION="${VERSION#v}"
          BUILD_NUM="${{ github.event.inputs.build_number || github.run_number }}"
          echo "Setting Version: $VERSION, Build: $BUILD_NUM"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" LongScreenshot/Resources/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" LongScreenshot/Resources/Info.plist || true

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project LongScreenshot.xcodeproj \
            -scheme LongScreenshot \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build & Archive iOS App
        run: |
          xcodebuild archive \
            -project LongScreenshot.xcodeproj \
            -scheme LongScreenshot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LongScreenshot.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/LongScreenshot.xcarchive/Products/Applications/LongScreenshot.app build/Payload/
          cd build
          zip -r -q "LongScreenshot_Release.ipa" Payload
          cd ..
          mkdir -p output
          mv build/LongScreenshot_Release.ipa output/
          echo "IPA Created Successfully at output/LongScreenshot_Release.ipa"
          ls -lh output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LongScreenshot-Release-IPA
          path: output/LongScreenshot_Release.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (Optional / Tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: output/LongScreenshot_Release.ipa
          name: "长截图 LongScreenshot v${{ github.event.inputs.version_name || github.ref_name }}"
          body: |
            ### 🚀 iPhone 长截图 App (LongScreenshot) 正式版
            - 修复录屏长截图模式中底部悬浮操作栏（如“说点什么吧...”输入框与互动按钮）被重复拼接的问题
            - 升级固定区域智能识别算法，支持毛玻璃与半透明背景悬浮栏的精准检测
            - 📸 截图无痕拼接 + 🎬 滚动录屏自动生成高清长图
            - ☀️ 浅色明亮与 🌙 深色深邃双色彩主题

            #### 📲 安装方法:
            1. 下载下方的 `LongScreenshot_Release.ipa`
            2. 使用 [Sideloadly](https://sideloadly.io/)、[AltStore](https://altstore.io/)、TrollStore 或 Scarlet 即可免费自签安装到真机！
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
