name: Build and Package iOS Release (IPA & TestFlight)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App Version (e.g. 2.3.3)'
        required: false
        default: '2.3.3'
      upload_testflight:
        description: '是否尝试上传到 TestFlight (需配置 Apple Developer Secrets)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_package:
    name: Build & Export IPA
    runs-on: macos-14
    permissions:
      contents: write
    env:
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - name: 检出代码 (Checkout Code)
        uses: actions/checkout@v4

      - name: 配置 Xcode 环境 (Select Xcode)
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      - name: 更新 App 版本号 (Set Version)
        run: |
          VERSION="${{ github.event.inputs.version_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '2.3.3' }}"
          VERSION="${VERSION#v}"
          BUILD_NUM="${{ github.run_number }}"
          echo "Setting Version: $VERSION, Build: $BUILD_NUM"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" LongScreenshot/Resources/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" LongScreenshot/Resources/Info.plist || true

      - name: 编译 iOS Release App (xcodebuild)
        run: |
          xcodebuild clean build \
            -project LongScreenshot.xcodeproj \
            -scheme LongScreenshot \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO > build_output.txt 2>&1 || true
          
          if grep -q "\*\* BUILD FAILED \*\*" build_output.txt; then
            echo "BUILD_HAS_FAILED=true" >> $GITHUB_ENV
          else
            echo "BUILD_HAS_FAILED=false" >> $GITHUB_ENV
          fi

      - name: 回传错误信息至 Commit 评论 (Post error to Commit Comment)
        if: env.BUILD_HAS_FAILED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('build_output.txt')) {
              const log = fs.readFileSync('build_output.txt', 'utf8');
              const lines = log.split('\n');
              const errorLines = lines.filter(l => l.includes('error:') || l.includes('fatal error:'));
              const tailLines = lines.slice(-80);
              const body = "### 🛠️ Build Log Errors:\n```text\n" + (errorLines.length ? errorLines.join('\n') : "No direct error string matched") + "\n```\n\n### 📋 Last 80 lines:\n```text\n" + tailLines.join('\n') + "\n```";
              try {
                await github.rest.repos.createCommitComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: context.sha,
                  body: body
                });
              } catch (e) {
                console.log('Failed to post commit comment:', e);
              }
            }

      - name: 打印完整构建日志并检查结果 (Assert Build Success)
        if: env.BUILD_HAS_FAILED == 'true'
        run: |
          cat build_output.txt
          exit 1

      - name: 打包为标准 iOS IPA 文件 (Package to IPA)
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "LongScreenshot.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: LongScreenshot.app not found!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          
          # Ad-hoc sign bundle for TrollStore / AltStore compatibility
          codesign --force --deep --sign - build/Payload/LongScreenshot.app || true
          
          cd build
          zip -r -q LongScreenshot_Release.ipa Payload
          cd ..
          ls -lh build/LongScreenshot_Release.ipa

      - name: 上传 IPA 安装包为 GitHub Artifacts (Upload IPA)
        uses: actions/upload-artifact@v4
        with:
          name: LongScreenshot-Release-IPA
          path: build/LongScreenshot_Release.ipa
          retention-days: 30

      - name: 发布至 GitHub Release (推送 Tag 或手动发布)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build/LongScreenshot_Release.ipa
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.event.inputs.version_name || '2.3.3') }}
          name: "长截图 LongScreenshot v${{ github.event.inputs.version_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '2.3.3' }}"
          body: |
            ### 🚀 iPhone 长截图 App (LongScreenshot) 正式版
            - 🎬 **录屏长截图算法全面升级**：
              - 攻克快速猛滑手势下减速探测跳帧导致的正文、卡片、横幅内容丢失问题
              - 引入严苛位移硬天花板与位移游标严格单调递增机制，保证 100% 内容完整度
              - 动态悬浮胶囊探针（Floating Pill Probe）自动避让“App内打开”等橙色半透明悬浮胶囊
              - 紧凑底栏智能探测，彻底解决底部评论区被误切、截断问题
              - 3 条带中位数运动追踪，彻底免疫正文中局部动画 GIF、原地踏步小人造成的位移偏航
            - 📸 截图无痕拼接 + 🎬 滚动录屏自动生成高清长图
            - ☀️ 浅色明亮与 🌙 深色深邃双色彩主题

            #### 📲 安装方法 (免越狱、免 Mac):
            1. 下载下方的 `LongScreenshot_Release.ipa`。
            2. 使用 TrollStore、[Sideloadly](https://sideloadly.io/)、[AltStore](https://altstore.io/) 或爱思助手，即可免费自签安装到 iPhone 真机！
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 部署至 TestFlight (可选，需配置证书秘钥)
        if: inputs.upload_testflight == true && env.APPSTORE_PRIVATE_KEY != ''
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          bundle install
          bundle exec fastlane beta
