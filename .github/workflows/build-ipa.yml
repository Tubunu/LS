name: Build iOS Release IPA

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App Version (e.g. 2.3.3)'
        required: false
        default: '2.3.3'
      build_number:
        description: 'Build Number (e.g. 1)'
        required: false
        default: '1'
      create_release:
        description: 'Create GitHub Release with IPA'
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build & Package IPA
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Set App Version & Build Number
        run: |
          VERSION="${{ github.event.inputs.version_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '2.3.3' }}"
          VERSION="${VERSION#v}"
          BUILD_NUM="${{ github.event.inputs.build_number || github.run_number }}"
          echo "Setting Version: $VERSION, Build: $BUILD_NUM"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" LongScreenshot/Resources/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" LongScreenshot/Resources/Info.plist || true

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project LongScreenshot.xcodeproj \
            -scheme LongScreenshot \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || true

      - name: Compile iOS Release App (xcodebuild)
        run: |
          xcodebuild clean build \
            -project LongScreenshot.xcodeproj \
            -scheme LongScreenshot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package iOS IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "LongScreenshot.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: LongScreenshot.app not found in build/DerivedData"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          
          # Ad-hoc sign the app bundle for seamless TrollStore / AltStore compatibility
          codesign --force --deep --sign - build/Payload/LongScreenshot.app || true
          
          cd build
          zip -r -q "LongScreenshot_Release.ipa" Payload
          cd ..
          mkdir -p output
          mv build/LongScreenshot_Release.ipa output/
          echo "IPA Created Successfully at output/LongScreenshot_Release.ipa"
          ls -lh output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LongScreenshot-Release-IPA
          path: output/LongScreenshot_Release.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (Optional / Tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: output/LongScreenshot_Release.ipa
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.event.inputs.version_name || '2.3.3') }}
          name: "长截图 LongScreenshot v${{ github.event.inputs.version_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '2.3.3' }}"
          body: |
            ### 🚀 iPhone 长截图 App (LongScreenshot) v2.3.3
            - 🎬 **录屏长截图算法全面升级**：
              - 攻克快速猛滑手势下减速探测跳帧导致的正文、卡片、横幅内容丢失问题
              - 引入严苛位移硬天花板与位移游标严格单调递增机制，保证 100% 内容完整度
              - 动态悬浮胶囊探针（Floating Pill Probe）自动避让“App内打开”等橙色半透明悬浮胶囊
              - 紧凑底栏智能探测，彻底解决底部评论区被误切、截断问题
              - 3 条带中位数运动追踪，彻底免疫正文中局部动画 GIF、原地踏步小人造成的位移偏航
            - 📸 截图无痕拼接 + 🎬 滚动录屏自动生成高清长图
            - ☀️ 浅色明亮与 🌙 深色深邃双色彩主题

            #### 📲 安装方法:
            1. 下载下方的 `LongScreenshot_Release.ipa`
            2. 使用 TrollStore、Sideloadly、AltStore 或 Scarlet 即可免费自签安装到 iPhone 真机！
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
